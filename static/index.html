<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Мессенджер</title>
  <link rel="stylesheet" href="/style.css">
  <script>document.documentElement.dataset.theme = localStorage.getItem('theme') || 'light';</script>
</head>
<body>
  <!-- Вход / регистрация -->
  <section id="auth" class="auth hidden">
    <form id="auth-form" class="auth-card">
      <h1>Мессенджер</h1>
      <input id="auth-username" placeholder="Логин" autocomplete="username" required>
      <input id="auth-display" placeholder="Имя (как вас видят другие)" class="hidden">
      <input id="auth-password" type="password" placeholder="Пароль" autocomplete="current-password" required>
      <div id="auth-error" class="error"></div>
      <button type="submit" id="auth-submit">Войти</button>
      <a href="#" id="auth-toggle">Нет аккаунта? Регистрация</a>
    </form>
  </section>

  <!-- Основной экран -->
  <section id="main" class="main hidden">
    <aside class="sidebar">
      <div class="sidebar-head">
        <button id="me-button" class="me" title="Настройки профиля">
          <span class="avatar" id="me-avatar"></span><span id="me-name"></span>
        </button>
        <div class="sidebar-buttons" id="sidebar-buttons">
          <button id="open-saved" title="Избранное">🔖</button>
          <button id="new-group" title="Новая группа">＋</button>
          <button id="open-settings" title="Настройки">⚙</button>
        </div>
      </div>
      <input id="search" class="search" placeholder="Поиск людей и ботов">
      <div id="search-results" class="list hidden"></div>
      <div id="chat-list" class="list"></div>
    </aside>

    <main class="chat">
      <div id="empty" class="empty">Выберите чат или найдите собеседника через поиск</div>
      <div id="chat-view" class="chat-view hidden">
        <header class="chat-head">
          <button id="back" class="back" title="Назад">←</button>
          <button id="chat-info" class="chat-info" title="Информация">
            <span class="avatar" id="chat-avatar"></span>
            <span class="chat-titles">
              <span id="chat-title" class="chat-title"></span>
              <span id="chat-subtitle" class="chat-subtitle"></span>
            </span>
          </button>
          <div id="header-buttons" class="header-buttons">
            <button id="toggle-search" title="Поиск по чату">🔍</button>
          </div>
        </header>

        <div id="chat-search" class="chat-search hidden">
          <input id="chat-search-input" placeholder="Поиск сообщений">
          <div id="chat-search-results" class="chat-search-results"></div>
        </div>

        <div id="pinned" class="pinned hidden">
          <div class="pinned-body">
            <div class="pinned-label">📌 Закреплённое сообщение</div>
            <div id="pinned-text" class="pinned-text"></div>
          </div>
          <button id="unpin" class="icon" title="Открепить">✕</button>
        </div>

        <div class="messages-wrap">
          <div id="messages" class="messages"></div>
          <button id="scroll-down" class="scroll-down hidden" title="Вниз">↓<span id="scroll-badge" class="badge hidden"></span></button>
        </div>

        <div class="composer-wrap">
          <div id="compose-context" class="compose-context hidden">
            <div class="compose-context-body">
              <div id="compose-context-title" class="compose-context-title"></div>
              <div id="compose-context-text" class="compose-context-text"></div>
            </div>
            <button id="compose-context-cancel" class="icon" title="Отмена">✕</button>
          </div>
          <div id="command-hints" class="command-hints hidden"></div>
          <div id="recording" class="recording hidden">
            <span class="rec-dot"></span><span id="rec-time">0:00</span>
            <span class="rec-hint">Идёт запись голосового…</span>
            <button id="rec-cancel" class="secondary">Отмена</button>
            <button id="rec-send">Отправить</button>
          </div>
          <form id="composer" class="composer">
            <button type="button" id="attach" class="round secondary" title="Прикрепить файл">📎</button>
            <input type="file" id="file-input" multiple hidden>
            <textarea id="input" rows="1" placeholder="Сообщение…  (/ — команды)"></textarea>
            <button type="submit" id="send" class="round" title="Отправить">🎤</button>
          </form>
        </div>
      </div>
    </main>
  </section>

  <!-- Модальное окно -->
  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <h3 id="modal-title"></h3>
      <div id="modal-body"></div>
      <div class="modal-actions">
        <button id="modal-cancel" class="secondary">Отмена</button>
        <button id="modal-ok">OK</button>
      </div>
    </div>
  </div>

  <div id="context-menu" class="context-menu hidden"></div>
  <div id="lightbox" class="lightbox hidden"><img id="lightbox-img" alt=""></div>
  <div id="drop-overlay" class="drop-overlay hidden">Отпустите, чтобы отправить файлы</div>
  <div id="toast" class="toast hidden"></div>

  <script src="/app.js"></script>
</body>
</html>
